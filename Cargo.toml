[package]
name = "sigmaos-zen-browser"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Zen Browser workspace, theme, and profile integration in Rust"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lib]
name = "sigmaos_zen_browser"
path = "src/lib.rs"
